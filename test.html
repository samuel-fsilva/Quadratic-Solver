<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My JSXGraph Example</title>
    <script src="lib/JSXgraph/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/JSXgraph/jsxgraph.css" />
  </head>
  <body>
    <div id="box" class="jxgbox" style="width: 500px; aspect-ratio: 1/1"></div>
    <script>
        var board = JXG.JSXGraph.initBoard(
                'box', {
                    boundingbox: [-10, 10, 10, -10],
                    axis: true
                });
        var A = board.create('point', [2, 1], {name: 'J'});
        var f = board.create(
                'functiongraph',
                [(x) => 0.5 * x ** 2 - 2 * x],
                {strokeWidth: 3}
        );
    </script>
  </body>
</html>
