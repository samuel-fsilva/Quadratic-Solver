<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadratic Solver</title>
    <script type="module">
      import { LaTeXJSComponent } from "https://cdn.jsdelivr.net/npm/latex.js/dist/latex.mjs";
      customElements.define("latex-js", LaTeXJSComponent);
    </script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/queries.css" />
    <script src="lib/JSXgraph/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/JSXgraph/jsxgraph.css" />
  </head>

  <body>
    <div id="card">
      <div id="title-box">
        <img
          src="images/calculator.svg"
          alt=""
          style="height: 5em; margin: 10px"
        />
        <h1>
          <span
            >Quadr<span class="title-span"
              >x<span id="title-power">2</span></span
            >tic</span
          ><span class="title-span" id="solver-span">Solver</span>
        </h1>
      </div>
      <div id="input">
        <div id="input-box">
          <select
            name=""
            id="signal-select01"
            class="signal-select invisible"
            autocomplete="off"
          >
            <option value="+" selected>+</option>
            <option value="-">-</option>
          </select>
          <input
            type="number"
            name=""
            id="c1"
            placeholder="a"
            autocomplete="off"
          />
          <input
            type="text"
            id="variable-input01"
            class="variable-input"
            placeholder="x"
            autocomplete="off"
            maxlength="1"
            pattern="[A-Za-z]"
          />
          <sup>2</sup>
          <select
            name=""
            id="signal-select02"
            class="signal-select"
            autocomplete="off"
          >
            <option value="+" selected>+</option>
            <option value="-">-</option>
          </select>
          <input
            type="number"
            name=""
            id="c2"
            placeholder="b"
            autocomplete="off"
          />
          <input
            type="text"
            id="variable-input02"
            class="variable-input"
            placeholder="x"
            autocomplete="off"
            maxlength="1"
            pattern="[A-Za-z]"
          />
          <select
            name=""
            id="signal-select03"
            class="signal-select"
            autocomplete="off"
          >
            <option value="+" selected>+</option>
            <option value="-">-</option>
          </select>
          <input
            type="number"
            name=""
            id="c3"
            placeholder="c"
            autocomplete="off"
          />
          <span id="zero-span">&nbsp;= 0</span>
        </div>
        <button id="submit"><span id="submit-text">=</span></button>
      </div>
      <div id="result-box" class="hidden">
        <h3 id="equation-title">
          <latex-js>$$\LARGE{ax^{2}+bx+c=0}$$</latex-js>
        </h3>
        <div id="results">
          <h3><latex-js>$$\LARGE{\text{Results:}}$$</latex-js></h3>
          <div id="result01" class="result-data">
            <latex-js>$$x_{1}=$$</latex-js>
          </div>

          <div id="result02" class="result-data">
            <latex-js>$$x_{2}=$$</latex-js>
          </div>

          <div id="delta" class="result-data">
            <latex-js>$$\Delta=$$</latex-js>
          </div>
        </div>
        <div id="graph-box">
          <h4>Function graph:</h4>
          <div id="graph">
            <script src="js/graph.js"></script>
          </div>
        </div>
      </div>
    </div>
    <script>
      const thisInputs = document.querySelectorAll("input");
      thisInputs.forEach((input) => {
        input.addEventListener("input", () => {
          if (input.value.length > 1 && input.value.length < 10) {
            input.style.width = input.value.length + "ch";
          } else if (input.value.length > 10) {
            input.style.width = "10.5ch";
          } else {
            input.style.width = "1ch";
          }
        });
      });
    </script>
    <script src="js/dom.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/app.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
